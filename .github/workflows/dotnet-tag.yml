name: .NET

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup pnpm and Node.js
      uses: pnpm/setup@v1
      with:
        package-json-file: src/BQuery/wwwroot/package.json
        runtime: node@26
        install: false
          
    - name: Pnpm install
      working-directory: src/BQuery/wwwroot
      run: pnpm install --frozen-lockfile
      
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Package
      run: dotnet pack src/BQuery/BQuery.csproj --configuration Release --output "./release/" -p:PackageVersion=${{ steps.version.outputs.VERSION }}
    
    - name: Publish 
      run: dotnet nuget push ./release/*.nupkg --api-key ${{secrets.PUBLISHKEY}} --source "https://api.nuget.org/v3/index.json" --skip-duplicate

