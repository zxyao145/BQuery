<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/BQuery/" />
    <link rel="icon" type="image/svg+xml" href="_content/BQuery.Sample.Common/icon.svg" />
    <link rel="stylesheet" href="_content/BQuery.Sample.Common/lab.css" />
    <script>
        (function (location) {
            if (location.search[1] !== "/") {
                return;
            }

            const route = location.search.slice(1).split("&").map((part) => part.replace(/~and~/g, "&")).join("?");
            window.history.replaceState(null, "", `${location.pathname.slice(0, -1)}${route}${location.hash}`);
        }(window.location));
    </script>
    <title>BQuery</title>
</head>
<body>
    <div id="app">Loading…</div>
    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/BQuery/dist/bQuery.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
