<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script>
        const segmentsToKeep = 1;
        const pageLocation = window.location;
        const basePath = pageLocation.pathname.split("/").slice(0, segmentsToKeep + 1).join("/");
        const route = pageLocation.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~");
        const search = pageLocation.search ? `&${pageLocation.search.slice(1).replace(/&/g, "~and~")}` : "";

        window.location.replace(`${pageLocation.protocol}//${pageLocation.host}${basePath}/?/${route}${search}${pageLocation.hash}`);
    </script>
</head>
<body></body>
</html>
